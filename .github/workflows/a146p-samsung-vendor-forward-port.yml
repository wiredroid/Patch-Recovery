name: A146P conservative Samsung 6.6.50 partial delta port to Google 6.6.89
on:
  push:
    branches: [a146p-ksunext-stock-build]
    paths: [.github/workflows/a146p-samsung-vendor-forward-port.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install source port tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git curl unzip tar python3
      - name: Fetch ONLY genuine Samsung GPL and official Google Linux baselines
        run: |
          set -euo pipefail
          mkdir -p work report
          curl -fL --retry 3 --retry-delay 2 -o work/samsung.zip 'https://github.com/wiredroid/Patch-Recovery/releases/download/a146p-stock-source/SM-A146P_15_Opensource.1.zip'
          echo '7c7cd421d17f46138fe2a0c633882d96dcfa426b18593f4df52cbbd5823da197  work/samsung.zip' | sha256sum -c -
          mkdir -p work/samsung
          unzip -p work/samsung.zip Kernel.tar.gz | tar -xz -C work/samsung
          test -f work/samsung/kernel-6.6/Makefile
          grep -q '^SUBLEVEL = 50$' work/samsung/kernel-6.6/Makefile
          git clone --depth=1 --branch android15-6.6-2025-06_r1 https://android.googlesource.com/kernel/common.git work/google
          grep -q '^SUBLEVEL = 89$' work/google/Makefile
          git -C work/google rev-parse HEAD > report/google-6.6.89-commit.txt
          git -C work/google fetch --depth=1 origin 4cdfe8c8c40affb63caa5e2626b52b0f8d47eca9
          git -C work/google checkout --detach FETCH_HEAD
          grep -q '^SUBLEVEL = 50$' work/google/Makefile
          git -C work/google rev-parse HEAD > report/google-6.6.50-commit.txt
      - name: Isolate Samsung 6.6.50 changes against Google 6.6.50
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2
          import hashlib
          samsung=Path('work/samsung/kernel-6.6')
          google=Path('work/google')
          def files(d):
              return {str(p.relative_to(d)):p for p in d.rglob('*') if p.is_file() and not p.is_symlink() and '.git' not in p.parts}
          a,b=files(samsung),files(google)
          changed=[];added=[];identical=0
          for rel,src in a.items():
              if rel in b:
                  dst=b[rel]
                  if src.stat().st_size==dst.stat().st_size and hashlib.sha256(src.read_bytes()).digest()==hashlib.sha256(dst.read_bytes()).digest():
                      identical+=1
                      continue
                  changed.append(rel)
              else:added.append(rel)
              dst=google/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              copy2(src,dst)
          Path('report/modified-6.6.50-Samsung-files.txt').write_text('\n'.join(sorted(changed))+'\n')
          Path('report/Samsung-only-files.txt').write_text('\n'.join(sorted(added))+'\n')
          summary=f'Identical Samsung/Google 6.6.50: {identical}\nSamsung-modified shared: {len(changed)}\nSamsung-added: {len(added)}\n'
          Path('report/base-match-summary.txt').write_text(summary)
          print(summary)
          PY
          git -C work/google add -A
          git -C work/google diff --cached --binary > report/Samsung-6.6.50-vs-Google-6.6.50.patch
          test -s report/Samsung-6.6.50-vs-Google-6.6.50.patch
          git -C work/google diff --cached --stat > report/vendor-delta-stat.txt
          wc -l report/Samsung-6.6.50-vs-Google-6.6.50.patch
          sha256sum report/Samsung-6.6.50-vs-Google-6.6.50.patch > report/vendor-patch-sha256.txt
      - name: Reproducible partial port, preserve Google 6.6.89 in conflicts and publish unported backlog
        run: |
          set -euo pipefail
          git -C work/google reset --hard
          git -C work/google clean -ffd
          git -C work/google checkout --detach "$(cat report/google-6.6.89-commit.txt)"
          grep -q '^SUBLEVEL = 89$' work/google/Makefile
          set +e
          git -C work/google apply --3way --index --verbose "$PWD/report/Samsung-6.6.50-vs-Google-6.6.50.patch" > report/forward-port.log 2>&1
          rc=$?
          set -e
          tail -n 65 report/forward-port.log
          echo "GIT_APPLY_EXIT=$rc" | tee report/port-status.txt
          git -C work/google status --short > report/post-port-status-before-resolution.txt
          git -C work/google diff --name-only --diff-filter=U > report/SAMSUNG-CHANGES-NOT-YET-PORTED.txt
          git -C work/google ls-files -u > report/unmerged-entries-before-resolution.txt
          echo "Conflicts awaiting semantic engineering:"
          wc -l report/SAMSUNG-CHANGES-NOT-YET-PORTED.txt
          head -n 55 report/SAMSUNG-CHANGES-NOT-YET-PORTED.txt
          if test "$rc" -ne 0 && test ! -s report/unmerged-entries-before-resolution.txt; then
            echo 'Unexpected patch error with NO merge conflicts: FAIL rather than masking it.'
            exit "$rc"
          fi
          # Conservative PARTIAL reconstruction: retain newer 6.6.89 code where
          # Samsung's 6.6.50 edits conflict. Do not silently overwrite newer
          # filesystem, memory management or Android vendor-hook implementations.
          # The reports explicitly list those unported Samsung changes.
          while IFS= read -r file; do
            test -n "$file" || continue
            if git -C work/google ls-files -u -- "$file" | awk '{print $3}' | grep -qx 2; then
              git -C work/google checkout --ours -- "$file"
              git -C work/google add -- "$file"
            else
              git -C work/google rm -f -- "$file"
            fi
            printf '%s\n' "$file" >> report/GKI-6.6.89-PREFERRED-CONFLICT-PATHS.txt
          done < report/SAMSUNG-CHANGES-NOT-YET-PORTED.txt
          if test -n "$(git -C work/google ls-files -u)"; then
            echo 'Unmerged Git index entries remain after partial-port checkpoint.'
            exit 13
          fi
          grep -q '^SUBLEVEL = 89$' work/google/Makefile
          test -f work/google/security/samsung/defex_lsm/Kconfig
          test -f work/google/include/linux/defex.h
          git -C work/google diff --cached --binary > report/CONSERVATIVE-PARTIAL-Samsung50-on-GKI89.patch
          test -s report/CONSERVATIVE-PARTIAL-Samsung50-on-GKI89.patch
          git -C work/google diff --cached --name-only > report/partial-port-applied-files.txt
          git -C work/google diff --cached --stat > report/partial-port-stats.txt
          git -C work/google diff --cached --check > report/whitespace-warnings.txt 2>&1 || true
          sha256sum report/CONSERVATIVE-PARTIAL-Samsung50-on-GKI89.patch | tee report/partial-port-sha256.txt
          git -C work/google status --short > report/post-port-status.txt
          {
            echo 'PARTIAL_FORWARD_PORT=YES'
            echo "ORIGINAL_GIT_APPLY_EXIT=$rc"
            echo "UNPORTED_SAMSUNG_CONFLICT_PATHS=$(wc -l < report/SAMSUNG-CHANGES-NOT-YET-PORTED.txt)"
            echo "APPLIED_PATCH_PATHS=$(wc -l < report/partial-port-applied-files.txt)"
            echo 'Conflict policy: retain Google 6.6.89 for every conflicted file, retain cleanly merged Samsung changes only.'
          } | tee report/PARTIAL-PORT-RESULT.txt
          cat > report/NOT-A-STOCK-FIRMWARE-BUILD.txt <<'EOF'
          NOT A COMPLETE VENDOR FORWARD-PORT. NOT A STOCK KERNEL BUILD.
          Conflicted Samsung changes were NOT applied: see SAMSUNG-CHANGES-NOT-YET-PORTED.txt.
          This is a reproducible partial source patch preserving newer Google Linux 6.6.89 changes and cleanly applied Samsung edits.
          A zero-exit of this workflow means partial source assembly is reproducible; it does NOT mean that the unresolved Samsung changes are solved.
          Reconstructing exact Samsung A146PXXUHEZB1 Linux 6.6.89 ABI/Module.symvers and locked-bootloader privilege-loading still require separate verification.
          This job does not produce or flash a kernel image.
          EOF
      - name: Upload Samsung-only delta, port results and conflicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A146P-GKI-6.6.89-Samsung50-forward-port-RESEARCH
          path: report/
          if-no-files-found: warn

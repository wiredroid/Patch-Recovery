name: A146P Samsung 6.6.50 KernelSU Next independent experimental module
on:
  push:
    branches: [a146p-ksunext-stock-build]
    paths: [.github/workflows/a146p-compile-experimental.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel compiler tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git clang-18 llvm-18 lld-18 make gcc bc bison flex libelf-dev libssl-dev dwarves rsync python3 unzip zstd cpio
      - name: Download Samsung source and pinned KernelSU Next
        run: |
          set -euo pipefail
          mkdir -p w report out
          curl -fLsS --retry 3 https://github.com/wiredroid/Patch-Recovery/releases/download/a146p-stock-source/SM-A146P_15_Opensource.1.zip -o w/samsung.zip
          echo '7c7cd421d17f46138fe2a0c633882d96dcfa426b18593f4df52cbbd5823da197  w/samsung.zip' | sha256sum -c -
          unzip -p w/samsung.zip Kernel.tar.gz | tar -xz -C w
          git clone --no-checkout --filter=blob:none https://github.com/KernelSU-Next/KernelSU-Next.git w/ksunext
          git -C w/ksunext fetch --depth=1 origin 159bc7da4266fd9331f63e25901629db4b7bfff8
          git -C w/ksunext checkout --detach FETCH_HEAD
          echo 'This Samsung source is Linux 6.6.50 but the installed stock firmware kernel is 6.6.89. Any module is an UNTESTED BUILD EXPERIMENT; NEVER FLASH/LOAD.' > report/NOT_FOR_FLASHING_OR_LOADING.txt
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) ' w/kernel-6.6/Makefile | tee report/kernel-source-version.txt
      - name: Build Samsung kernel to create real Module.symvers
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-18/bin:$PATH
          ROOT="$PWD"
          KDIR="$ROOT/w/kernel-6.6"
          OUT="$ROOT/w/kernel-out"
          mkdir -p "$OUT"
          make -C "$KDIR" O="$OUT" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld gki_defconfig
          "$KDIR/scripts/config" --file "$OUT/.config" -d AUTOFDO_CLANG -d PGO_CLANG -d PROPELLER_CLANG -d CFI_CLANG -d LTO_CLANG -e LTO_NONE -e MODULES -e MODVERSIONS
          make -C "$KDIR" O="$OUT" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld olddefconfig
          grep -E 'CONFIG_(AUTOFDO|PGO_CLANG|PROPELLER_CLANG|CFI_CLANG|MODVERSIONS|LTO_NONE|ARM64_4K_PAGES|MODULES)' "$OUT/.config" | tee "$ROOT/report/config-checks.txt"
          if grep -Eq '^CONFIG_(AUTOFDO_CLANG|PGO_CLANG|PROPELLER_CLANG)=y' "$OUT/.config"; then
            echo 'ERROR AutoFDO still enabled after config update'; exit 5
          fi
          set +e
          timeout 65m make -C "$KDIR" O="$OUT" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld -j4 vmlinux > "$ROOT/report/kernel-compile.log" 2>&1
          RC=$?
          set -e
          tail -n 100 "$ROOT/report/kernel-compile.log"
          echo "Kernel compile exit: $RC"
          test "$RC" -eq 0
          test -s "$OUT/vmlinux.symvers"
          test -s "$OUT/System.map"
          cp "$OUT/vmlinux.symvers" "$OUT/Module.symvers"
          make -C "$KDIR" O="$OUT" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld -j2 modules_prepare
          test -s "$OUT/scripts/module.lds"
          wc -l "$OUT/Module.symvers" | tee "$ROOT/report/symbol-count.txt"
          cp "$OUT/Module.symvers" "$ROOT/report/Module.symvers.experimental"
          cp "$OUT/System.map" "$ROOT/report/System.map"
      - name: Build Linux 6.6.50 kernel Image.gz for offline evaluation (NOT FLASHABLE)
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-18/bin:$PATH
          ROOT="$PWD"; KDIR="$ROOT/w/kernel-6.6"; OUT="$ROOT/w/kernel-out"
          set +e
          timeout 30m make -C "$KDIR" O="$OUT" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld -j4 Image.gz > "$ROOT/report/kernel-image-build.log" 2>&1
          RC=$?
          set -e
          tail -n 65 "$ROOT/report/kernel-image-build.log"
          echo "Image.gz build status=$RC" | tee "$ROOT/report/kernel-image-status.txt"
          if test "$RC" -eq 0 && test -s "$OUT/arch/arm64/boot/Image.gz"; then
            cp "$OUT/arch/arm64/boot/Image.gz" "$ROOT/out/A146P-SAMSUNG-SOURCE-6.6.50-KERNEL-IMAGE-NOT-FOR-FLASHING.gz"
            sha256sum "$ROOT/out/"*.gz | tee "$ROOT/report/kernel-image-sha256.txt"
          else
            echo 'No Image.gz produced. This does not necessarily prevent external module compilation.' > "$ROOT/report/kernel-image-blocker.txt"
          fi
      - name: Record firmware and early-boot compatibility limits
        run: |
          cat > report/DEVICE-MIGRATION-PRECONDITIONS.txt <<'EOF'
          Samsung A146P Android15 GPL source Linux 6.6.50 only. Not shipping A146PXXUHEZB1 stock Linux 6.6.89.
          This standalone kernel Image.gz is NOT a flashable Samsung boot.img; no exact matching boot image, DTB/DTBO, vendor modules, verified OEM signature, or on-device boot test was established.
          Do NOT flash it or use its .ko on Linux 6.6.89.
          FolkPatch/APatch root must remain until a verified independent KernelSU boot chain is proven.
          Modifying boot/init_boot cannot preserve stock locked verified boot.
          EOF
      - name: Compile KernelSU Next LKM with Samsung headers and symbols
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-18/bin:$PATH
          ROOT="$PWD"
          KDIR="$ROOT/w/kernel-6.6"
          OUT="$ROOT/w/kernel-out"
          KSU="$ROOT/w/ksunext/kernel"
          set +e
          make -C "$KDIR" O="$OUT" M="$KSU" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld CONFIG_KSU=m CONFIG_KSU_SAMSUNG_RKP=y CONFIG_KSU_SAMSUNG_DEFEX=y CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y CONFIG_KSU_SAMSUNG_KDP=n KBUILD_MODPOST_WARN=1 -j2 modules > "$ROOT/report/ksu-compile.log" 2>&1
          RC=$?
          set -e
          tail -n 120 "$ROOT/report/ksu-compile.log"
          echo "KSU compile exit: $RC"
          test "$RC" -eq 0
          test -s "$KSU/kernelsu.ko"
          cp "$KSU/kernelsu.ko" "$ROOT/out/kernelsu-6.6.50-EXPERIMENTAL-NOT-FOR-LOADING.ko"
          strings "$ROOT/out/"*.ko | grep '^vermagic=' | tee "$ROOT/report/vermagic.txt"
          llvm-readelf -h "$ROOT/out/"*.ko | tee "$ROOT/report/ELF-header.txt"
          nm -u "$ROOT/out/kernelsu-6.6.50-EXPERIMENTAL-NOT-FOR-LOADING.ko" | awk '{print $NF}' | sort -u > "$ROOT/report/module-imports.txt"
          awk '{print $3}' "$OUT/System.map" | sort -u > "$ROOT/report/kernel-symbols.txt"
          comm -23 "$ROOT/report/module-imports.txt" "$ROOT/report/kernel-symbols.txt" > "$ROOT/report/not-present-in-built-kernel.txt"
          awk '{print $2}' "$OUT/Module.symvers" | sort -u > "$ROOT/report/kernel-exports.txt"
          comm -23 "$ROOT/report/module-imports.txt" "$ROOT/report/kernel-exports.txt" > "$ROOT/report/non-exported-imports.txt"
          wc -l "$ROOT/report/module-imports.txt" "$ROOT/report/not-present-in-built-kernel.txt" "$ROOT/report/non-exported-imports.txt" | tee "$ROOT/report/import-counts.txt"
          test ! -s "$ROOT/report/not-present-in-built-kernel.txt"
          sha256sum "$ROOT/out/kernelsu-6.6.50-EXPERIMENTAL-NOT-FOR-LOADING.ko" | tee "$ROOT/report/module-sha256.txt"
      - name: Publish diagnostics and explicitly untested module
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a146p-experimental-6.6.50-build
          path: |
            report/
            out/
          if-no-files-found: error

name: A146P stock HEZB1 GKI89 reconstructed kernel build and ABI preflight
on:
  push:
    branches: [a146p-ksunext-stock-build]
    paths:
      - .github/workflows/a146p-stock-6.6.89-abi-build.yml
      - 'a146p-stock/patches/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconstruct-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM18 and kernel build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git gh make gcc clang-18 llvm-18 lld-18 bc bison flex libssl-dev libelf-dev dwarves cpio rsync python3 zstd
      - name: Fetch pinned OFFICIAL Google GKI 6.6.89 and verified Samsung-only partial delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work report
          git clone --depth=1 --branch android15-6.6-2025-06_r1 https://android.googlesource.com/kernel/common.git work/google89
          test "$(git -C work/google89 rev-parse HEAD)" = ebbf6177d5ae521e9902af2816ef56ff366bccfa
          grep -q '^SUBLEVEL = 89$' work/google89/Makefile
          gh run download 38715878102 --repo wiredroid/Patch-Recovery --name A146P-GKI-6.6.89-Samsung50-forward-port-RESEARCH --dir work/port-audit
          cp work/port-audit/SAMSUNG-CHANGES-NOT-YET-PORTED.txt report/UNRESOLVED-SAMSUNG-PORTS.txt
          test "$(wc -l < report/UNRESOLVED-SAMSUNG-PORTS.txt)" -eq 44
          test -s work/port-audit/CONSERVATIVE-PARTIAL-Samsung50-on-GKI89.patch
          echo '32eceb687814b50c00326822097b233f2b8e9520028bc76a91e7f30e956fd3b7  work/port-audit/CONSERVATIVE-PARTIAL-Samsung50-on-GKI89.patch' | sha256sum -c -
          git -C work/google89 apply --check "$PWD/work/port-audit/CONSERVATIVE-PARTIAL-Samsung50-on-GKI89.patch"
          git -C work/google89 apply "$PWD/work/port-audit/CONSERVATIVE-PARTIAL-Samsung50-on-GKI89.patch"
          # Restore Samsung's corruption diagnostic helper in the retained GKI89 header.
          # Cross-checked with Samsung GPL A146P50 and pinned A146P89/A145R92 references.
          # Source candidate only; exact HEZB1 stock ABI remains unverified.
          F2FS_PORT="$PWD/a146p-stock/patches/0001-f2fs-restore-samsung-corruption-dump-helper.patch"
          test -s "$F2FS_PORT"
          git -C work/google89 apply --check "$F2FS_PORT"
          git -C work/google89 apply "$F2FS_PORT"
          grep -q 'static inline void print_block_data' work/google89/fs/f2fs/f2fs.h
          # Retain GKI89's inode layout extensions; restore only the Samsung
          # ML-stream fields confirmed in the original A146PXXUHEZB1 stock BTF.
          ML_STREAM_PORT="$PWD/a146p-stock/patches/0002-f2fs-restore-stock-confirmed-ml-stream-inode-fields.patch"
          test -s "$ML_STREAM_PORT"
          git -C work/google89 apply --check "$ML_STREAM_PORT"
          git -C work/google89 apply "$ML_STREAM_PORT"
          grep -q '__u32 is_cache;' work/google89/fs/f2fs/f2fs.h
          grep -q '__u32 is_force_cold;' work/google89/fs/f2fs/f2fs.h
          sha256sum "$ML_STREAM_PORT" > report/SAMSUNG-F2FS-ML-STREAM-PATCH-SHA256.txt
          # Restore Samsung's GPL F2FS filesystem-statistic and extra-fsck-block
          # definitions and their actual implementation, retaining GKI89 code.
          # Verified against original stock BTF for f2fs_sb_info and nested types.
          F2FS_SEC_PORT="$PWD/a146p-stock/patches/0003-f2fs-samsung-stat-and-fsck-block-integration.patch"
          test -s "$F2FS_SEC_PORT"
          git -C work/google89 apply --check "$F2FS_SEC_PORT"
          git -C work/google89 apply "$F2FS_SEC_PORT"
          grep -q 'struct f2fs_sec_stat_info' work/google89/fs/f2fs/f2fs.h
          grep -q 'void f2fs_get_fsck_stat(' work/google89/fs/f2fs/super.c
          grep -q 'struct f2fs_sb_extra_flag_blk' work/google89/include/linux/f2fs_fs.h
          sha256sum "$F2FS_SEC_PORT" > report/SAMSUNG-F2FS-FSCK-STATS-PATCH-SHA256.txt
          # Samsung's compression extent-cache caller is retained by the port,
          # but the corresponding A146P GPL helper is absent from Google's GKI89 header.
          # Restore only that Samsung helper; do not disable compression safeguards.
          F2FS_COMPRESS_PORT="$PWD/a146p-stock/patches/0004-f2fs-restore-samsung-compression-extent-helper.patch"
          test -s "$F2FS_COMPRESS_PORT"
          git -C work/google89 apply --check "$F2FS_COMPRESS_PORT"
          git -C work/google89 apply "$F2FS_COMPRESS_PORT"
          grep -q 'static inline bool f2fs_has_compressed_data' work/google89/fs/f2fs/f2fs.h
          sha256sum "$F2FS_COMPRESS_PORT" > report/SAMSUNG-F2FS-COMPRESSION-HELPER-PATCH-SHA256.txt
          # Stock A146PXXUHEZB1 BTF: f2fs_mount_info=376, flush_group at byte 16.
          # Missing Samsung field displaces 118 subsequent f2fs_sb_info offsets by -8.
          F2FS_FLUSH_GROUP_PORT="$PWD/a146p-stock/patches/0005-f2fs-restore-stock-confirmed-flush-group-layout.patch"
          test -s "$F2FS_FLUSH_GROUP_PORT"
          git -C work/google89 apply --check "$F2FS_FLUSH_GROUP_PORT"
          git -C work/google89 apply "$F2FS_FLUSH_GROUP_PORT"
          grep -q 'kgid_t flush_group;' work/google89/fs/f2fs/f2fs.h
          sha256sum "$F2FS_FLUSH_GROUP_PORT" > report/SAMSUNG-F2FS-FLUSH-GROUP-PATCH-SHA256.txt
          cat > report/stock-BTF-F2FS-ML-layout-anchor.tsv <<'EOF'
          struct_name\tstock_size_bytes\tmember\tstock_byte_offset
          f2fs_inode_info\t1440\tis_cache\t1384
          f2fs_inode_info\t1440\tis_force_cold\t1424
          EOF
          sha256sum "$F2FS_PORT" > report/SAMSUNG-F2FS-HELPER-PATCH-SHA256.txt
          git -C work/google89 diff -- fs/f2fs/f2fs.h > report/SAMSUNG-F2FS-HELPER-applied-header.diff
          grep -R -n --include='*.c' 'ignore_fs_panic' work/google89/fs work/google89/drivers > report/ignore_fs_panic-C-references.txt || true
          echo 'F2FS helper source port only; not stock-validated.' > report/SAMSUNG-F2FS-SOURCE-PORT-NOTICE.txt
          grep -q '^SUBLEVEL = 89$' work/google89/Makefile
          test -f work/google89/include/linux/defex.h
          test -f work/google89/security/samsung/defex_lsm/Kconfig
          git -C work/google89 status --porcelain > report/partial-source-working-tree-status.txt
          cat > report/STOCK-IMAGE-HASH-GATE.txt <<'EOF'
          Target handset firmware SM-A146P A146PXXUHEZB1, stock Linux 6.6.89-android15-8-abA146PXXUHEZB1-4k.
          ORIGINAL BOOT SHA256 0fa1f56be55b5f1c0aaac5855ee0ec9c1f388fe101202a13790b7694d48c20f9
          ORIGINAL INIT_BOOT SHA256 a514ef26365ff0e92871e74d2e87f1da5a4461e4e40e0b7d4cebdf72a18d4976
          Exact hashes indicate bit-for-bit IDENTICAL original OEM image bytes. They are not proof of source equivalence.
          This build intentionally does not modify, reconstruct, or claim hash equality for those original Samsung-signed images.
          Stock boot/init_boot bytes have NOT been uploaded to GitHub for this workflow; no comparison against their bytes is made.
          Adding KernelSU to boot/init_boot necessarily changes the hash and fails locked Samsung verified boot unless signed by trusted OEM keys.
          The new research image from this source, if any, is NEVER a Samsung-certified stock replacement.
          EOF
      - name: Resolve actual stock IKCONFIG against Samsung partial-GKI89 tree and quantify drift
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-18/bin:$PATH
          ROOT="$PWD"
          OUT="$ROOT/work/build"
          KDIR="$ROOT/work/google89"
          mkdir -p "$OUT"
          cp a146p-stock/stock-A146PXXUHEZB1-6.6.89.config "$OUT/.config"
          cp "$OUT/.config" report/original-stock-IKCONFIG.txt
          make -C "$KDIR" O="$OUT" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld olddefconfig > report/olddefconfig.log 2>&1
          cp "$OUT/.config" report/resolved-GKI89-partial-stock-config.txt
          python3 - <<'PY'
          from pathlib import Path
          def parse(path):
              a={}
              for s in Path(path).read_text().splitlines():
                  if s.startswith('CONFIG_') and '=' in s:
                      k,v=s.split('=',1);a[k]=v
                  elif s.startswith('# CONFIG_') and s.endswith(' is not set'):
                      a[s[2:-11]]='n'
              return a
          target=parse('report/original-stock-IKCONFIG.txt')
          new=parse('report/resolved-GKI89-partial-stock-config.txt')
          absent=sorted(k for k in target if k not in new)
          mismatched=sorted((k,target[k],new[k]) for k in target if k in new and new[k]!=target[k])
          Path('report/CONFIG-missing-from-candidate.txt').write_text('\n'.join(absent)+'\n')
          Path('report/CONFIG-drift.tsv').write_text('option\tstock\tcandidate\n'+'\n'.join('\t'.join(v) for v in mismatched)+'\n')
          counts=(f'Stock explicit options: {len(target)}\nCandidates resolved: {len(new)}\n'
                  f'Options absent: {len(absent)}\nOptions different: {len(mismatched)}\n'
                  'Even if this step passes, candidate is NOT stock ABI equivalent, and 44 vendor conflict paths remain unresolved.\n')
          Path('report/CONFIG-drift-summary.txt').write_text(counts)
          print(counts)
          for k in ['CONFIG_ARM64_4K_PAGES','CONFIG_MODVERSIONS','CONFIG_DEBUG_INFO_BTF','CONFIG_SECURITY_DEFEX','CONFIG_SAMSUNG_GKI_KERNEL','CONFIG_LTO_NONE']:
              print(k,'stock=',target.get(k),'candidate=',new.get(k))
          PY
      - name: Substitute local development module-signing key ONLY for research build
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-18/bin:$PATH
          ROOT="$PWD"; KDIR="$ROOT/work/google89"; OUT="$ROOT/work/build"
          grep '^CONFIG_MODULE_SIG_KEY=' "$OUT/.config" | tee report/OEM-MODULE-SIGNING-KEY-REQUIREMENT.txt
          if grep -q 'DEVICE_MODULES_REL_DIR.*/certs/mtk_signing_key.pem' "$OUT/.config"; then
            "$KDIR/scripts/config" --file "$OUT/.config" --set-str MODULE_SIG_KEY certs/signing_key.pem
            make -C "$KDIR" O="$OUT" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld olddefconfig > report/research-only-dev-key-olddefconfig.log 2>&1
            echo 'RESEARCH BUILD ONLY: substituted ephemeral self-signed signing key for inaccessible OEM private MediaTek signing key. Any resulting signatures differ from stock; not compatible with locked OEM verified boot.' > report/RESEARCH-MODULE-SIGNATURE-NOT-STOCK.txt
            grep '^CONFIG_MODULE_SIG_KEY=' "$OUT/.config" | tee report/RESEARCH-KEY-CONFIG.txt
          else
            echo 'No known private MTK module signing key path found. No substitution performed.' > report/RESEARCH-MODULE-SIGNATURE-NOT-STOCK.txt
          fi
      - name: Compile vmlinux of PARTIAL 6.6.89 source (not a flashable image)
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-18/bin:$PATH
          ROOT="$PWD"
          KDIR="$ROOT/work/google89"
          OUT="$ROOT/work/build"
          set +e
          timeout 75m make -C "$KDIR" O="$OUT" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld -j4 vmlinux > report/compile-vmlinux.log 2>&1
          rc=$?
          set -e
          echo "VMLINUX_COMPILE_EXIT=$rc" | tee report/vmlinux-status.txt
          echo 'FIRST compiler errors and context, preserving actual root cause:'
          grep -n -m 35 -E 'error:|fatal:|No rule to make target|No such file or directory|undefined reference' report/compile-vmlinux.log || true
          tail -n 45 report/compile-vmlinux.log
          test "$rc" -eq 0
          test -s "$OUT/vmlinux"
          test -s "$OUT/System.map"
          sha256sum "$OUT/vmlinux" | tee report/vmlinux-sha256.txt
          wc -c "$OUT/vmlinux" | tee report/vmlinux-size.txt
          if test -s "$OUT/vmlinux.symvers"; then
            cp "$OUT/vmlinux.symvers" report/CANDIDATE-vmlinux.symvers
            wc -l "$OUT/vmlinux.symvers" | tee report/kernel-symbol-count.txt
          fi
      - name: Compare rebuilt kernel BTF declarations against EXACT Samsung stock struct sizes
        run: |
          set -euo pipefail
          OUT="$PWD/work/build"
          cat > report/stock-BTF-expected-sizes.tsv <<'EOF'
          name	stock_size_bytes
          task_struct	4800
          cred	184
          file	264
          f2fs_sb_info	5992
          f2fs_mount_info	376
          f2fs_inode_info	1440
          f2fs_super_block	3072
          f2fs_checkpoint	192
          defex_context	88
          EOF
          mkdir -p report/pahole-structs
          while IFS="$(printf '\t')" read -r name stock_size; do
            test "$name" != name || continue
            pahole -C "$name" "$OUT/vmlinux" > "report/pahole-structs/$name.txt" 2> "report/pahole-structs/$name.errors" || true
          done < report/stock-BTF-expected-sizes.tsv
          python3 - <<'PY'
          from pathlib import Path
          import re
          out=['name\tstock_size\tcandidate_size\tcomparison']
          for line in Path('report/stock-BTF-expected-sizes.tsv').read_text().splitlines()[1:]:
              name,expected=line.split('\t')
              txt=Path(f'report/pahole-structs/{name}.txt').read_text()
              hits=re.findall(r'/\*\s*size:\s*(\d+)',txt)
              got=hits[-1] if hits else 'NOT_EXTRACTED'
              state='SIZE_MATCH_ONLY' if got==expected else 'UNVERIFIED_OR_MISMATCH'
              out.append(f'{name}\t{expected}\t{got}\t{state}')
          Path('report/STOCK-BTF-vs-CANDIDATE-size-audit.tsv').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY
          echo 'SIZE_MATCH_ONLY is NOT proof that full member offsets, structure layouts, function behavior, symbol CRCs, or stock firmware signatures match.' > report/BTF-AUDIT-NOTICE.txt
          # Fail closed on actual shipping OEM BTF dimensions; don't accept only
          # successful compilation as proof of source-structure compatibility.
          python3 - <<'PY'
          from pathlib import Path
          import csv, re
          summary={row['name']:row for row in csv.DictReader(
              Path('report/STOCK-BTF-vs-CANDIDATE-size-audit.tsv').open(),delimiter='\t')}
          required={'f2fs_sb_info':'5992','f2fs_mount_info':'376'}
          for name, expected in required.items():
              row=summary.get(name)
              if row is None or row['stock_size']!=expected or row['candidate_size']!=expected:
                  raise SystemExit(f'FAIL: {name} BTF size is not exact stock {expected}: {row}')
          def actual_offset(struct, field):
              txt=Path(f'report/pahole-structs/{struct}.txt').read_text()
              m=re.search(r'\b'+re.escape(field)+r';\s*/\*\s*(\d+)\s+\d+\s*\*/',txt)
              if not m:
                  raise SystemExit(f'FAIL: missing BTF field {struct}.{field}')
              return int(m.group(1))
          for struct, field, expected in [('f2fs_mount_info','flush_group',16),
                                          ('f2fs_sb_info','gc_lock',2416)]:
              got=actual_offset(struct,field)
              if got!=expected:
                  raise SystemExit(f'FAIL: {struct}.{field} offset {got}, expected {expected}')
          print('PASS: stock BTF f2fs_mount_info=376, flush_group=16, f2fs_sb_info=5992, gc_lock=2416')
          PY
      - name: Compile pinned KernelSU Next .ko against partial GKI89 vmlinux (UNVERIFIED RESEARCH ONLY)
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-18/bin:$PATH
          ROOT="$PWD"; KDIR="$ROOT/work/google89"; OUT="$ROOT/work/build"; KSU="$ROOT/work/ksunext/kernel"
          mkdir -p report/research-module
          git clone --no-checkout --filter=blob:none https://github.com/KernelSU-Next/KernelSU-Next.git work/ksunext
          git -C work/ksunext fetch --depth=1 origin 159bc7da4266fd9331f63e25901629db4b7bfff8
          git -C work/ksunext checkout --detach FETCH_HEAD
          test "$(git -C work/ksunext rev-parse HEAD)" = 159bc7da4266fd9331f63e25901629db4b7bfff8
          echo 'EXPERIMENTAL PARTIAL GKI89 module, NOT FOR LOADING on OEM Samsung A146P, original bootloader locked or unlocked.' > report/research-module/READ-ME-NOT-FOR-LOADING.txt
          echo 'Source tree has 44 unresolved Samsung vendor differences, possible config drift, missing actual OEM Module.symvers CRCs and private signing key.' >> report/research-module/READ-ME-NOT-FOR-LOADING.txt
          echo 'GhostLock stock root requires a real original signed kernel module-ABI match and separate exploit validation; this result is only compiler diagnostics.' >> report/research-module/READ-ME-NOT-FOR-LOADING.txt
          make -C "$KDIR" O="$OUT" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld modules_prepare > report/research-module/modules-prepare.log 2>&1
          if test -s "$OUT/vmlinux.symvers"; then
            cp "$OUT/vmlinux.symvers" "$OUT/Module.symvers"
            cp "$OUT/vmlinux.symvers" report/research-module/CANDIDATE-Module.symvers
          else
            echo 'Candidate vmlinux.symvers absent' > report/research-module/MISSING-SYMVERS.txt
          fi
          set +e
          timeout 12m make -C "$KDIR" O="$OUT" ARCH=arm64 LLVM=1 CC=clang LD=ld.lld M="$KSU" CONFIG_KSU=m CONFIG_KSU_SAMSUNG_RKP=y CONFIG_KSU_SAMSUNG_DEFEX=y CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y CONFIG_KSU_SAMSUNG_KDP=n KBUILD_MODPOST_WARN=1 -j2 modules > report/research-module/module-build.log 2>&1
          rc=$?
          set -e
          echo "EXPERIMENTAL_MODULE_COMPILE_EXIT=$rc" | tee report/research-module/status.txt
          grep -n -m 90 -E 'error:|fatal:|WARNING:|undefined!|undefined symbol|disagrees about|modpost:' report/research-module/module-build.log > report/research-module/first-errors-and-modpost.txt || true
          tail -n 80 report/research-module/module-build.log
          if test -s "$KSU/kernelsu.ko"; then
            mkdir -p report/research-module/BINARY-DO-NOT-LOAD
            cp "$KSU/kernelsu.ko" report/research-module/BINARY-DO-NOT-LOAD/A146P-GKI89-PARTIAL-KSUNEXT-UNVERIFIED-DO-NOT-LOAD.ko
            sha256sum "$KSU/kernelsu.ko" > report/research-module/candidate-ko-sha256.txt
            strings "$KSU/kernelsu.ko" | grep '^vermagic=' > report/research-module/candidate-ko-vermagic.txt || true
            nm -u "$KSU/kernelsu.ko" | awk '{print $NF}' | sort -u > report/research-module/candidate-ko-imports.txt || true
            (test -s "$OUT/Module.symvers" && wc -l "$OUT/Module.symvers") > report/research-module/candidate-symvers-count.txt || true
            echo 'Emitting diagnostic-only module: NOT OEM validated; module build warnings do NOT justify insertion on stock kernel.' >> report/research-module/READ-ME-NOT-FOR-LOADING.txt
          else
            echo 'No resulting kernelsu.ko; inspect module-build.log' > report/research-module/NO-MODULE.txt
          fi
      - name: Upload all diagnostics whether compilation passes or fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A146P-stock-HEZB1-partial-GKI89-ABI-PREFLIGHT-NOT-FLASHABLE
          path: report/
          if-no-files-found: warn
